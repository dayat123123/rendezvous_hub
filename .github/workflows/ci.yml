name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Jalankan E2E Playwright terhadap stack dev monorepo (butuh secret MONOREPO_TOKEN)
        type: boolean
        default: false
      monorepo_ref:
        description: Branch atau tag chat_service_supabase untuk E2E
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.2
  GITLEAKS_IMG: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

jobs:
  verify:
    name: Lint, token, format, typecheck, unit, build, ukuran, lisensi
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ci

  image:
    name: Image nginx + Trivy
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t olt-social/cs-console:${{ github.sha }} .
      - name: Trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: olt-social/cs-console:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy dependencies, secrets, config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'

  secrets:
    name: gitleaks (riwayat git)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMG" git /repo --config /repo/.gitleaks.toml --redact --no-banner

  e2e:
    name: E2E Playwright vs stack dev monorepo
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rendezvous_hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rendezvous_hub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dayat123123/chat_service_supabase
          ref: ${{ inputs.monorepo_ref }}
          token: ${{ secrets.MONOREPO_TOKEN }}
          path: chat_service_supabase
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: rendezvous_hub/package-lock.json
      - name: Throwaway dev secrets
        working-directory: chat_service_supabase
        run: make gen-secrets
      - name: Stack dev + OLT dummy + Rendezvous Hub
        working-directory: chat_service_supabase
        run: make up DUMMY_OLT=1
      - name: Dev staff accounts
        working-directory: chat_service_supabase
        run: make cs-staff
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8085
          MONOREPO_DIR: ../chat_service_supabase
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            rendezvous_hub/playwright-report
            rendezvous_hub/test-results
          retention-days: 7
